
name: Python QA Automation

on:
  push:
    branches:
      - main
      - feature/vijay_tests
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python --version
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt
        shell: cmd

      - name: Run Pytest
        run: .venv\Scripts\python.exe -m pytest -v
        shell: cmd

      - name: Test execution completed
        if: always()
        run: echo Test execution completed

      - name: Execution passed
        if: success()
        run: echo Execution passed

      - name: Execution failed
        if: failure()
        run: echo Execution failed
